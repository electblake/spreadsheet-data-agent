[project]
name = "spreadsheet-data-agent"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=3.4.7",
    "loguru>=0.7.3",
    "openai>=3.3.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "platformdirs>=4.11.5",
    "pydantic>=2.13.4",
    "tiktoken>=0.14.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
build = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["SpreadsheetDataAgent*"]

[tool.ruff]
# target-version = "py38"
line-length = 120
required-version = ">=0.15.7"
src = ["SpreadsheetDataAgent", "tests"]
extend-exclude = ["vendor", "dist", "data", "notebooks", ".vscode", ".agents/.trash"]
