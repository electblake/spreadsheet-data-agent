[project]
name = "spreadsheet-data-agent"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastmcp",
    "loguru",
    "openai",
    "openpyxl",
    "pandas",
    "platformdirs",
    "pydantic",
    "tiktoken",
    "xlrd",
]

[project.scripts]
fastmcp = "spreadsheet_data_agent.mcp_cli:main"

[project.optional-dependencies]
build = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sitecustomize"]

[tool.setuptools.packages.find]
include = ["spreadsheet_data_agent*", "SpreadsheetDataAgent*"]

[tool.ruff]
# target-version = "py38"
line-length = 120
required-version = ">=0.15.7"
src = ["spreadsheet_data_agent", "SpreadsheetDataAgent", "tests"]
extend-exclude = ["vendor", "dist", "data", "notebooks", ".vscode", ".agents/.trash"]
